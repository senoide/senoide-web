# Genera la web (site/) cada vez que cambia el código fuente (fuente/) en main.
# El servidor publica site/ en unos 5 minutos (scripts/actualizar.sh).
name: Generar web
on:
  push:
    branches: [main]
    paths: ["fuente/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: generar-web
  cancel-in-progress: false
jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generar
        run: |
          pip install --quiet pillow
          cd fuente && python build.py
      - name: Subir site/ si ha cambiado
        run: |
          git config user.name "senoide-web"
          git config user.email "info@senoide.es"
          git add -A site
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "Web generada desde fuente/ ($(git rev-parse --short HEAD))"
          git push
